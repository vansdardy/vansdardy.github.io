---
layout: default
---
<article class="prose container project-page">
  <p class="project-page__back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>

  <header class="page-head">
    <h1>{{ page.title }}</h1>

    <div class="project-page__meta">
      {% if page.date %}<span class="badge">{{ page.date | date: "%b %-d, %Y" }}</span>{% endif %}
      {% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}
    </div>
  </header>

  {{ content }}
</article>
