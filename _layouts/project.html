---
layout: default
---
<article class="prose container project-page">
  <p class="project-page__back"><a href="{{ '/projects/' | relative_url }}">← All projects</a></p>

  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="page-head__subtitle">{{ page.summary }}</p>{% endif %}

    <div class="project-page__meta">
      {% if page.year %}<span class="badge">{{ page.year }}</span>{% endif %}
      {% for t in page.tech %}<span class="tag">{{ t }}</span>{% endfor %}
    </div>

    <div class="project-page__links">
      {% if page.repo %}<a class="btn btn--small" href="{{ page.repo }}" target="_blank" rel="noopener">Source ↗</a>{% endif %}
      {% if page.demo %}<a class="btn btn--small" href="{{ page.demo }}" target="_blank" rel="noopener">Live demo ↗</a>{% endif %}
    </div>
  </header>

  {{ content }}
</article>
