<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#119955">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/img/VitisViridis.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/VitisViridis.png' | relative_url }}">

  <!-- jekyll-seo-tag: <title>, description, canonical URL, Open Graph + Twitter cards.
       Driven by _config.yml (title, description, author, url) and per-page front matter. -->
  {% seo %}

  <!-- Set the saved/system color theme BEFORE paint to avoid a flash. -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark'
                       : matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <!-- Fonts: Space Grotesk (display) + Inter (body). Mono uses the system stack. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
