{%- comment -%}
  Renders the contact / social links from _data/social.yml.
  Each entry: { label, url, icon } — icon is an inline SVG name handled below.
{%- endcomment -%}
<ul class="social">
  {%- for link in site.data.social -%}
    <li>
      <a class="social__link" href="{{ link.url }}"
         {% unless link.url contains 'mailto:' %}target="_blank" rel="me noopener"{% endunless %}>
        <span class="social__label">{{ link.label }}</span>
      </a>
    </li>
  {%- endfor -%}
</ul>
